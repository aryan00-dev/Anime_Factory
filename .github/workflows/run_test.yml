name: Veda Cloud Factory Bot

on:
  workflow_dispatch: 
  schedule:
    - cron: '30 3 * * *'  # Subah 9:00 AM IST
    - cron: '30 12 * * *' # Shaam 6:00 PM IST

jobs:
  run-factory:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Locker (Repo) check kar raha hu
        uses: actions/checkout@v4

      - name: ⚙️ Python Engine Set Kar raha hu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛠️ Zaroori Tools Install Kar raha hu
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install -r requirements.txt

      - name: 🚀 Veda Factory Start! (Video Ban rahi hai)
        run: python main.py

      - name: 💾 Final Reel Download Link (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Viral-Anime-Reel
          path: Factory_Workspace/Final_Reels/*.mp4
