name: Run Gemini Test

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install GenAI
        run: pip install google-genai

      - name: Run Test Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test.py
