name: Veda Cloud Engine Brahmastra

on:
  schedule:
    - cron: '30 12 * * *' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For MoviePy TextClip)
        run: |
          sudo apt-get update 
          sudo apt-get install -y imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Veda Engine Factory 🚀
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python main.py

      - name: Check Workspace System (For Debugging)
        if: always()
        run: |
          echo "--- Checking File System ---"
          ls -R workspace/ || echo "Workspace folder abhi tak nahi bana hai."
