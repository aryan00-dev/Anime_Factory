name: Run Anime Factory Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Tools (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"//' /etc/ImageMagick-6/policy.xml

      - name: Python Libraries Install
        run: |
          pip install google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy==1.0.3 Pillow==9.5.0 gTTS

      - name: 🚀 LAUNCH THE BRAHMASTRA BOT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: python bot.py

      - name: 📥 Get the Final Reel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viral_Anime_Reel
          path: final_with_outro.mp4
